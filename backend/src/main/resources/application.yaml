server:
  servlet:
    context-path: /api
app:
  cors:
    allowed-origin: "http://localhost:5173"
spring:
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: jdbc:mysql://localhost:3306/myscholar?createDatabaseIfNotExist=true
    username: root
    password: ${db_root_password}
  jpa:
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300 # 5m
    refreshTokenExpiration: 604800 # 7d