<svg
  width="500"
  height="500"
  viewBox="0 0 500 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(250 230) rotate(90) scale(220)">
      <stop offset="0%" stop-color="#EEF4FF"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>

    <!-- Paper gradient -->
    <linearGradient id="paperGradient"
      x1="145" y1="105"
      x2="350" y2="390"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>

    <!-- Glass gradient -->
    <linearGradient id="glassGradient"
      x1="185" y1="130"
      x2="310" y2="280"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0ECFF"/>
      <stop offset="100%" stop-color="#B8D0F5"/>
    </linearGradient>

    <!-- Handle gradient -->
    <linearGradient id="handleGradient"
      x1="300" y1="300"
      x2="390" y2="390"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="15"
        flood-color="#64748B"
        flood-opacity="0.16"
      />
    </filter>

    <!-- Small shadow -->
    <filter id="softShadow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="7"
        flood-color="#64748B"
        flood-opacity="0.12"
      />
    </filter>

    <!-- Clip paper -->
    <clipPath id="paperClip">
      <path d="
        M145 115
        C145 101 156 90 170 90
        H330
        C344 90 355 101 355 115
        V335
        C355 349 344 360 330 360
        H170
        C156 360 145 349 145 335
        Z
      "/>
    </clipPath>
  </defs>
    <rect width="500" height="500" fill="#f7f9fb"/>
  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <circle
    cx="250"
    cy="235"
    r="220"
    fill="url(#bgGlow)"
  />

  <!-- Decorative circles -->
  <circle
    cx="104"
    cy="166"
    r="8"
    fill="#CBD5E1"
    opacity="0.55"
  />

  <circle
    cx="405"
    cy="130"
    r="11"
    fill="#D7E3F7"
    opacity="0.65"
  />

  <circle
    cx="392"
    cy="350"
    r="7"
    fill="#CBD5E1"
    opacity="0.55"
  />

  <!-- Decorative plus -->
  <g opacity="0.5">
    <path
      d="M112 286V310"
      stroke="#94A3B8"
      stroke-width="4"
      stroke-linecap="round"
    />
    <path
      d="M100 298H124"
      stroke="#94A3B8"
      stroke-width="4"
      stroke-linecap="round"
    />
  </g>

  <!-- Decorative sparkle -->
  <g opacity="0.55">
    <path
      d="M390 225L396 239L410 245L396 251L390 265L384 251L370 245L384 239L390 225Z"
      fill="#AFC6E8"
    />
  </g>

  <!-- ===================================================== -->
  <!-- DOCUMENT -->
  <!-- ===================================================== -->

  <g filter="url(#shadow)">

    <!-- Paper -->
    <path
      d="
        M145 115
        C145 101 156 90 170 90
        H330
        C344 90 355 101 355 115
        V335
        C355 349 344 360 330 360
        H170
        C156 360 145 349 145 335
        Z
      "
      fill="url(#paperGradient)"
    />

    <!-- Paper border -->
    <path
      d="
        M145 115
        C145 101 156 90 170 90
        H330
        C344 90 355 101 355 115
        V335
        C355 349 344 360 330 360
        H170
        C156 360 145 349 145 335
        Z
      "
      stroke="#D8E0EA"
      stroke-width="3"
    />

  </g>

  <!-- Folded corner -->
  <path
    d="M305 90V125C305 134 312 141 321 141H355"
    fill="#E7EDF5"
  />

  <path
    d="M305 90L355 141H321C312 141 305 134 305 125V90Z"
    fill="#DCE5F1"
  />

  <!-- Document top accent -->
  <rect
    x="174"
    y="125"
    width="95"
    height="10"
    rx="5"
    fill="#CBD8EA"
  />

  <rect
    x="174"
    y="148"
    width="145"
    height="7"
    rx="3.5"
    fill="#E1E7EF"
  />

  <!-- Document lines -->
  <g opacity="0.8">
    <rect x="174" y="180" width="126" height="8" rx="4" fill="#DCE3EC"/>
    <rect x="174" y="201" width="150" height="8" rx="4" fill="#E2E7EE"/>
    <rect x="174" y="222" width="112" height="8" rx="4" fill="#DCE3EC"/>
    <rect x="174" y="243" width="136" height="8" rx="4" fill="#E2E7EE"/>
  </g>

  <!-- ===================================================== -->
  <!-- NO RESULT SYMBOL -->
  <!-- ===================================================== -->

  <g filter="url(#softShadow)">

    <!-- Magnifying glass lens -->
    <circle
      cx="245"
      cy="240"
      r="67"
      fill="url(#glassGradient)"
      stroke="#5B78A6"
      stroke-width="10"
    />

    <!-- Inner glass -->
    <circle
      cx="245"
      cy="240"
      r="53"
      fill="#EAF2FF"
      opacity="0.65"
    />

    <!-- Glass reflection -->
    <path
      d="
        M213 204
        C224 193 239 187 254 188
      "
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
      opacity="0.8"
    />

    <!-- Magnifying glass handle -->
    <path
      d="
        M294 290
        L362 358
      "
      stroke="url(#handleGradient)"
      stroke-width="23"
      stroke-linecap="round"
    />

    <path
      d="
        M294 290
        L362 358
      "
      stroke="#475569"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.45"
    />

  </g>

  <!-- ===================================================== -->
  <!-- X / EMPTY RESULT SYMBOL -->
  <!-- ===================================================== -->

  <g opacity="0.9">
    <path
      d="M222 217L268 263"
      stroke="#64748B"
      stroke-width="9"
      stroke-linecap="round"
    />

    <path
      d="M268 217L222 263"
      stroke="#64748B"
      stroke-width="9"
      stroke-linecap="round"
    />
  </g>

  <!-- ===================================================== -->
  <!-- FLOATING PAPER ELEMENTS -->
  <!-- ===================================================== -->

  <g transform="rotate(-12 104 350)" opacity="0.85">

    <rect
      x="72"
      y="320"
      width="64"
      height="78"
      rx="10"
      fill="#FFFFFF"
      stroke="#D9E2EC"
      stroke-width="3"
      filter="url(#softShadow)"
    />

    <rect
      x="85"
      y="339"
      width="36"
      height="6"
      rx="3"
      fill="#CBD5E1"
    />

    <rect
      x="85"
      y="355"
      width="42"
      height="6"
      rx="3"
      fill="#E2E8F0"
    />

    <rect
      x="85"
      y="371"
      width="30"
      height="6"
      rx="3"
      fill="#E2E8F0"
    />

  </g>

  <g transform="rotate(13 398 300)" opacity="0.75">

    <rect
      x="375"
      y="275"
      width="52"
      height="65"
      rx="9"
      fill="#FFFFFF"
      stroke="#D9E2EC"
      stroke-width="3"
      filter="url(#softShadow)"
    />

    <path
      d="M388 294H414"
      stroke="#CBD5E1"
      stroke-width="6"
      stroke-linecap="round"
    />

    <path
      d="M388 310H416"
      stroke="#E2E8F0"
      stroke-width="6"
      stroke-linecap="round"
    />

    <path
      d="M388 326H405"
      stroke="#E2E8F0"
      stroke-width="6"
      stroke-linecap="round"
    />

  </g>

  <!-- ===================================================== -->
  <!-- BOTTOM SHADOW -->
  <!-- ===================================================== -->

  <ellipse
    cx="250"
    cy="405"
    rx="120"
    ry="18"
    fill="#94A3B8"
    opacity="0.12"
  />

  <!-- Small decorative dots -->
  <g opacity="0.5">
    <circle cx="135" cy="425" r="4" fill="#CBD5E1"/>
    <circle cx="150" cy="425" r="4" fill="#CBD5E1"/>
    <circle cx="165" cy="425" r="4" fill="#CBD5E1"/>
  </g>
<text
  x="250"
  y="465"
  text-anchor="middle"
  font-family="Arial, sans-serif"
  font-size="18"
  font-weight="600"
  fill="#64748B"
>
  No Results
</text>
</svg>