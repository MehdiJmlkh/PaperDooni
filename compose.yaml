services:
  frontend: 
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    # ports:
      # - "8080:8080"
    environment:
      SPRING_JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/google_scholar
      SPRING_DATASOURCE_USERNAME: root
      APP_CORS_ALLOWED_ORIGIN: http://localhost
    secrets:
      - db_root_password
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: google_scholar
      MYSQL_ROOT_PASSWORD_FILE: run/secrets/db_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    secrets:
      - db_root_password 

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt

volumes:
  mysql_data:
